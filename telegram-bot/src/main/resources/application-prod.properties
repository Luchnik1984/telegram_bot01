# Logging (products)
logging.level.pro.sky.telegrambot=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.file.name=logs/telegram-bot.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Database (products) - through environment variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/telegram_bot_prod}
spring.datasource.username=${DATABASE_USERNAME:telegram_bot_user}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate (products)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Bot token
telegram.bot.token=${BOT_TOKEN:}

# Liquibase
spring.liquibase.enabled=true

# Server settings
server.port=${SERVER_PORT:8080}

# Efficiency
server.error.include-stacktrace=never
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true